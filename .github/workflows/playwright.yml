name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        BASE_URL: ${{ secrets.BASE_URL || 'https://eventmanage-wheat.vercel.app' }}
        STUDENT_ID: ${{ secrets.STUDENT_ID || '23A81A0001' }}
        STUDENT_PASSWORD: ${{ secrets.STUDENT_PASSWORD || 'student123' }}
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@gmail.com' }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}
        API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://eventmanage-wheat.vercel.app' }}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
